project_id = "mystery-malaysia"

[auth]
site_url = "com.mysterymalaysia://login-callback/"
additional_redirect_urls = ["com.mysterymalaysia://login-callback/**"]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/enforce_auth_user_limit"

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[functions.generate-mission]
verify_jwt = true

[functions.send-email]
verify_jwt = false
